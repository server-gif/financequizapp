    <style>
      /*

      #custom-interstitial-popup .close-wrap {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 5px;
        align-items: center;
        gap: 2px;
      }

      div#count-down-wrap {
        color: #000 !important;
        font-size: 13px;
      }

      #custom-interstitial-popup .ads-label {
        margin-top: 5px;
        text-align: center;
        margin-bottom: 0;
        color: #333 !important;
        margin-bottom: 5px;
      }

      /*---- New Design -----------*/

      #custom-interstitial-popup #close-button {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: transparent;
        border: 1px solid #ff4757;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
      }

      #custom-interstitial-popup #close-button::before,
      #custom-interstitial-popup #close-button::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 2px;
        background: #ff4757;
        transition: all 0.3s ease;
      }

      #custom-interstitial-popup #close-button::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      #custom-interstitial-popup #close-button::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      #custom-interstitial-popup #close-button:hover {
        background: #ff4757;
        border-color: #ff4757;
      }

      #custom-interstitial-popup #close-button:hover::before,
      #custom-interstitial-popup #close-button:hover::after {
        background: white;
      }

      #custom-interstitial-popup #countdown {
        color: #000 !important;
      }

      .ads-popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: -1;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease;
      }

      /* Active state - visible */
      .ads-popup-overlay.active {
        opacity: 1;
        visibility: visible;
        z-index: 9999;
      }

      /* Popup box */
      .ads-popup {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 14px;
        padding: 25px 20px;
        width: 80%;
        max-width: 100%;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        animation: fadeInZoom 0.35s ease-out;
      }

      /* Ad label */
      #adsPopup .ads-label {
        font-size: 12px;
        color: #333;
        margin-top: 5px;
        text-transform: uppercase;
      }

      /* Close button */
      .ads-close-btn {
        position: absolute;
        top: 8px;
        right: 12px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        opacity: 0.8;
        display: none;
      }

      .ads-close-btn.active {
        display: block;
      }

      .ads-popup h3 {
        color: #333;
      }

      /* Timer text */
      .ads-loading {
        position: absolute;
        top: 8px;
        /* right: 0; */
        left: auto;
        /* border: none; */
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;

        color: #333;
      }

      .close-wrap {
        margin-bottom: 30px;

      }

      @media (max-width: 768px) {
        .ads-popup {
          width: 100%;
          max-width: 100%;
        }
      }
    </style>
    <div class="ads-popup-overlay" id="adsPopup">
